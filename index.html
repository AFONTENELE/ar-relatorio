<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Ar-Condicionado - Hospital do Coração</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: #140505; color: #fef2f2; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 22px; color: #f87171; }
  h2 { margin: 0 0 16px; font-size: 16px; }
  section { background: #240a0a; border: 1px solid #4c1515; border-radius: 14px; padding: 20px; }
  form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  label { display: grid; gap: 5px; font-size: 12px; color: #fecaca; align-content: start; }
  input, select { width: 100%; padding: 9px 11px; background: #140505; color: #fef2f2; border: 1px solid #7f1d1d; border-radius: 8px; font: inherit; }
  input:focus, select:focus { outline: 2px solid #ef4444; }
  .full { grid-column: 1 / -1; }
  .hidden { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; background: #dc2626; color: #fff; }
  button:hover { background: #b91c1c; }
  button.sec { background: #7f1d1d; }
  button.sec:hover { background: #991b1b; }
  button.del { background: transparent; border: 1px solid #f87171; }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #4c1515; vertical-align: top; }
  th { color: #fca5a5; font-size: 11px; text-transform: uppercase; }
  small { color: #fca5a5; display: block; }
  td button { padding: 5px 10px; font-size: 12px; margin: 0 4px 4px 0; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head h2 { margin: 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; margin-top: 2px; }
  .badge.ok { background: #052e16; border-color: #166534; color: #86efac; }
  .badge.warn { background: #422006; border-color: #854d0e; color: #fde047; }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    body { background: #fff; color: #000; padding: 0; }
    main { display: block; max-width: none; }
    h1 { color: #b91c1c; margin-bottom: 12px; }
    section { background: #fff; border: 0; padding: 0; }
    .no-print, th:last-child, td:last-child:not([colspan]) { display: none; }
    .table { overflow: visible; }
    th, td { border: 1px solid #999; color: #000; }
    th, small { color: #333; }
  }
  #msg { color: #fecaca; min-height: 20px; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>❄ Cadastro de Ar-Condicionado</h1>

  <section class="no-print">
    <h2 id="formTitle">Adicionar Máquina</h2>
    <form id="form">
      <label>Número de patrimônio
        <input id="asset" list="patrimonioList" placeholder="Digite ou selecione o patrimônio (Ex: 33376)">
        <datalist id="patrimonioList"></datalist>
        <span id="assetHint" class="badge">Digite o patrimônio para buscar na planilha</span>
      </label>

      <label>Ambiente / Localização *
        <input id="nameSelect" list="nameList" required placeholder="Digite ou selecione o ambiente">
        <datalist id="nameList"></datalist>
      </label>

      <label>Marca *
        <input id="brand" list="brandList" required placeholder="Digite ou selecione a marca">
        <datalist id="brandList"></datalist>
      </label>

      <label>Modelo
        <input id="model" placeholder="Código na etiqueta">
      </label>

      <label>Capacidade (BTU/h) *
        <input id="btuUnit" list="btuList" required placeholder="Ex: 12000">
        <datalist id="btuList"></datalist>
      </label>

      <label>Tipo de aparelho *
        <input id="type" list="typeList" required placeholder="Digite ou selecione o tipo">
        <datalist id="typeList"></datalist>
      </label>

      <label>Tecnologia
        <input id="tech" list="techList" placeholder="Ex: Inverter">
        <datalist id="techList"></datalist>
      </label>

      <label>Ciclo
        <input id="cycle" list="cycleList" placeholder="Ex: Frio">
        <datalist id="cycleList"></datalist>
      </label>

      <label>Tensão
        <input id="voltage" list="voltageList" placeholder="Ex: 220 V">
        <datalist id="voltageList"></datalist>
      </label>

      <label>Gás refrigerante
        <input id="gas" list="gasList" placeholder="Ex: R-410A">
        <datalist id="gasList"></datalist>
      </label>

      <label>Quantidade *
        <input id="qty" type="number" min="1" max="500" value="1" required>
      </label>

      <div class="actions full">
        <button type="submit" id="submitBtn">Adicionar Máquina</button>
        <button type="button" id="cancelBtn" class="sec hidden">Cancelar</button>
      </div>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section>
    <div class="head">
      <h2>Máquinas cadastradas (<span id="total">0</span>)</h2>
      <div class="actions no-print">
        <button type="button" id="importAllBtn" class="sec" title="Importar todos os itens da planilha para a lista">Importar Base da Planilha (193)</button>
        <button type="button" id="pdfBtn">Exportar PDF</button>
        <button type="button" id="sheetBtn">Exportar Planilha</button>
      </div>
    </div>
    <div class="table">
      <table>
        <thead><tr><th>Patrimônio</th><th>Ambiente / Localização</th><th>Marca / Modelo</th><th>Capacidade</th><th>Detalhes</th><th>Qtd</th><th>Ações</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </section>
</main>

"523 INFRAESTRUTURA", "m": "", "b": null}, {"p": "42896", "l": "523 INFRAESTRUTURA", "m": "MIDEA", "b": null}, {"p": "44740", "l": "533 SERVICO DE ARQUIVO MEDI", "m": "", "b": 60000}, {"p": "33541", "l": "533 SERVICO DE ARQUIVO MEDI", "m": "", "b": null}, {"p": "46583", "l": "534 GESTAO DA QUALIDADE E SE", "m": "", "b": null}, {"p": "49643", "l": "548 SESMT", "m": "", "b": null}, {"p": "49644", "l": "621 AGENCIA TRANSFUSIONAL", "m": "", "b": null}, {"p": "33780", "l": "621 AGENCIA TRANSFUSIONAL", "m": "", "b": 12000}, {"p": "39418", "l": "638 RAIOS X", "m": "", "b": null}, {"p": "50017", "l": "671 CENTRAL DE ORTESES, PRO", "m": "", "b": null}, {"p": "31459", "l": "674 RECURSOS HUMANOS", "m": "", "b": null}, {"p": "23049", "l": "675 COMPRAS", "m": "", "b": null}, {"p": "13713", "l": "677 CONTABILIDADE", "m": "", "b": null}, {"p": "32010", "l": "713 UTI ADULTO CONVENIO", "m": "", "b": null}, {"p": "44651", "l": "713 UTI ADULTO CONVENIO", "m": "", "b": null}, {"p": "50042", "l": "717 COMERCIAL", "m": "", "b": null}, {"p": "37031", "l": "717 COMERCIAL", "m": "", "b": null}];

const PLANILHA_MAP = new Map(PLANILHA_DATA.map(item => [item.p, item]));
const PLANILHA_LOCAIS = [...new Set(PLANILHA_DATA.map(i => i.l).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));

const BRAND_NORMALIZE = {
  'AGRATTO': 'Agratto',
  'CARRIER': 'Carrier',
  'CONSUL': 'Consul',
  'ELECTROLUX': 'Electrolux',
  'HITACHI': 'Hitachi',
  'KOMECO': 'Komeco',
  'LG': 'LG',
  'MIDEA': 'Midea',
  'SPRINGER': 'Springer',
  'SPRINGER CARRIER': 'Springer Carrier',
  'TCL': 'TCL',
  'YANG': 'Yang',
  'YORK': 'York'
};

const OPTIONS = {
  nameList: PLANILHA_LOCAIS,
  brandList: ['Agratto', 'Carrier', 'Consul', 'Daikin', 'Electrolux', 'Elgin', 'Fujitsu', 'Gree', 'Hisense', 'Hitachi', 'Komeco', 'LG', 'Midea', 'Philco', 'Samsung', 'Springer', 'Springer Carrier', 'Springer Midea', 'TCL', 'Trane', 'Yang', 'York'],
  btuList: [900, 1200, 2400, 7000, 7300, 7500, 9000, 10000, 12000, 18000, 21000, 22000, 24000, 30000, 36000, 48000, 57000, 60000, 80000, 90000],
  typeList: ['Split Hi-Wall', 'Multi Split', 'Janela', 'Cassete', 'Piso-Teto', 'Duto / Embutido', 'Portátil'],
  techList: ['Inverter', 'Convencional (On/Off)'],
  cycleList: ['Frio', 'Quente e Frio'],
  voltageList: ['127 V', '220 V monofásico', '220 V trifásico', '380 V trifásico'],
  gasList: ['R-32', 'R-410A', 'R-22']
};

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('pt-BR');

for (const [listId, values] of Object.entries(OPTIONS)) {
  const datalist = $(listId);
  if (!datalist) continue;
  datalist.textContent = '';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = typeof v === 'number' ? v : v;
    if (typeof v === 'number') {
      opt.label = fmt(v) + ' BTU/h';
    }
    datalist.appendChild(opt);
  });
}

const datalist = $('patrimonioList');
PLANILHA_DATA.forEach(item => {
  const opt = document.createElement('option');
  opt.value = item.p;
  opt.label = [item.l, item.m, item.b ? fmt(item.b) + ' BTUs' : ''].filter(Boolean).join(' | ');
  datalist.appendChild(opt);
});

let machines = [];
let editId = null;
try { machines = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) {}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(machines)); return true; }
  catch (e) { return false; }
}

function lookupPatrimonio(rawAsset) {
  const key = rawAsset.trim();
  const hint = $('assetHint');
  if (!key) {
    hint.textContent = 'Digite o patrimônio para buscar na planilha';
    hint.className = 'badge';
    return;
  }
  const match = PLANILHA_MAP.get(key) || PLANILHA_DATA.find(item => item.p.replace(/^0+/, '') === key.replace(/^0+/, ''));
  if (match) {
    $('nameSelect').value = match.l || '';
    const normBrand = match.m ? (BRAND_NORMALIZE[match.m.toUpperCase()] || match.m) : '';
    $('brand').value = normBrand;
    $('btuUnit').value = match.b ? match.b : '';

    const missing = [];
    if (!normBrand) missing.push('Marca');
    if (!match.b) missing.push('BTUs');
    hint.textContent = missing.length
      ? `Encontrado (${match.l}) — preencha: ${missing.join(' e ')}`
      : `Encontrado: ${match.l} • ${normBrand} • ${fmt(match.b)} BTUs`;
    hint.className = missing.length ? 'badge warn' : 'badge ok';
  } else {
    hint.textContent = 'Patrimônio não consta na planilha — preencha livremente';
    hint.className = 'badge warn';
  }
}

function resetForm() {
  editId = null;
  $('form').reset();
  $('assetHint').textContent = 'Digite o patrimônio para buscar na planilha';
  $('assetHint').className = 'badge';
  $('formTitle').textContent = $('submitBtn').textContent = 'Adicionar Máquina';
  $('cancelBtn').classList.add('hidden');
}

function edit(m) {
  resetForm();
  editId = m.id;
  for (const id of ['asset', 'nameSelect', 'brand', 'model', 'btuUnit', 'type', 'tech', 'cycle', 'voltage', 'gas', 'qty']) {
    $(id).value = m[id] !== undefined && m[id] !== null ? m[id] : '';
  }
  if (m.asset) lookupPatrimonio(m.asset);
  $('formTitle').textContent = 'Editar Máquina';
  $('submitBtn').textContent = 'Salvar Alterações';
  $('cancelBtn').classList.remove('hidden');
  $('form').scrollIntoView({ behavior: 'smooth' });
}

function remove(m) {
  if (!confirm('Excluir a máquina do ambiente "' + m.nameSelect + '"?')) return;
  machines = machines.filter(x => x.id !== m.id);
  if (editId === m.id) resetForm();
  save();
  render();
}

function cell(row, text, detail) {
  const td = row.insertCell();
  td.textContent = text;
  if (detail) td.appendChild(document.createElement('small')).textContent = detail;
  return td;
}

function render() {
  const list = $('list');
  list.textContent = '';
  machines.forEach(m => {
    const row = list.insertRow();
    cell(row, m.asset || '—');
    cell(row, m.nameSelect);
    cell(row, m.brand || '—', m.model);
    cell(row, m.btuUnit ? fmt(m.btuUnit) + ' BTU/h' : '—');
    cell(row, m.type || '—', [m.tech, m.cycle, m.voltage, m.gas].filter(Boolean).join(' • '));
    cell(row, m.qty);
    const actions = cell(row, '');
    for (const [label, cls, fn] of [['Editar', 'sec', edit], ['Excluir', 'del', remove]]) {
      const b = actions.appendChild(document.createElement('button'));
      b.textContent = label;
      b.className = cls;
      b.onclick = () => fn(m);
    }
  });
  if (!machines.length) {
    const td = list.insertRow().insertCell();
    td.colSpan = 7;
    td.textContent = 'Nenhuma máquina cadastrada. Digite um patrimônio acima ou clique em "Importar Base da Planilha".';
  }
  $('total').textContent = fmt(machines.reduce((sum, m) => sum + Number(m.qty), 0));
}

$('asset').addEventListener('input', e => lookupPatrimonio(e.target.value));
$('asset').addEventListener('change', e => lookupPatrimonio(e.target.value));
$('cancelBtn').onclick = resetForm;

$('form').onsubmit = e => {
  e.preventDefault();
  const data = {};
  for (const id of ['asset', 'nameSelect', 'brand', 'model', 'btuUnit', 'type', 'tech', 'cycle', 'voltage', 'gas', 'qty']) {
    data[id] = $(id).value.trim();
  }
  data.btuUnit = data.btuUnit ? Number(data.btuUnit) : '';
  data.qty = Number(data.qty) || 1;

  if (!data.nameSelect || !data.brand) { $('msg').textContent = 'Preencha o ambiente e a marca.'; return; }

  if (editId) machines = machines.map(m => m.id === editId ? { ...m, ...data } : m);
  else machines.unshift({ id: Date.now().toString() + Math.random().toString(36).slice(2, 6), ...data });

  $('msg').textContent = save() ? 'Salvo com sucesso!' : 'Adicionado, mas o navegador não permitiu salvar.';
  resetForm();
  render();
};

$('importAllBtn').onclick = () => {
  const existingAssets = new Set(machines.map(m => m.asset).filter(Boolean));
  const toAdd = PLANILHA_DATA.filter(item => !existingAssets.has(item.p));
  if (!toAdd.length) {
    alert('Todos os patrimônios da planilha já estão na lista cadastrada.');
    return;
  }
  if (!confirm(`Deseja importar ${toAdd.length} equipamentos da planilha para a tabela abaixo para ir completando os dados?`)) return;
  const imported = toAdd.map((item, idx) => ({
    id: (Date.now() + idx).toString(),
    asset: item.p,
    nameSelect: item.l,
    brand: item.m ? (BRAND_NORMALIZE[item.m.toUpperCase()] || item.m) : '',
    model: '',
    btuUnit: item.b || '',
    type: '',
    tech: '',
    cycle: '',
    voltage: '',
    gas: '',
    qty: 1
  }));
  machines = [...machines, ...imported];
  save();
  render();
  $('msg').textContent = `${imported.length} itens importados da planilha! Clique em "Editar" em qualquer linha para completar os dados.`;
};

$('pdfBtn').onclick = () => {
  if (!machines.length) { alert('Nenhuma máquina para exportar.'); return; }
  window.print();
};

$('sheetBtn').onclick = () => {
  if (!machines.length) { alert('Nenhuma máquina para exportar.'); return; }
  const columns = [['asset', 'Patrimônio'], ['nameSelect', 'Ambiente'], ['brand', 'Marca'], ['model', 'Modelo'], ['btuUnit', 'Capacidade (BTU/h)'], ['type', 'Tipo'], ['tech', 'Tecnologia'], ['cycle', 'Ciclo'], ['voltage', 'Tensão'], ['gas', 'Gás'], ['qty', 'Quantidade']];
  const quote = v => '"' + String(v).replace(/"/g, '""') + '"';
  const value = (m, key) => {
    let v = String(m[key] ?? '');
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return key === 'asset' && /^\d+$/.test(v) ? '="' + v + '"' : quote(v);
  };
  const lines = [columns.map(c => quote(c[1])), ...machines.map(m => columns.map(c => value(m, c[0])))];
  const blob = new Blob(['\ufeff' + lines.map(l => l.join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'ar_condicionado_' + new Date().toLocaleDateString('sv') + '.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};

render();
</script>
